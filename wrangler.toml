name = "p2p"
main = "worker.js"
compatibility_date = "2025-01-01"

# Static frontend served from ./public on the same origin as the signaling server.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws/*", "/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# New free-plan Durable Objects must be SQLite-backed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# TURN credentials (optional but recommended). Set with:
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
